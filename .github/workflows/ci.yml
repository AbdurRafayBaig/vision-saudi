name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match the Node used for development, because the npm that
          # ships with it is what wrote package-lock.json. Node 20 ships npm 10,
          # which cannot resolve an optional transitive an npm 11 lockfile
          # records differently, and every run died on "Missing: @emnapi/core
          # from lock file" before it reached a single check. GitHub is also
          # retiring Node 20 on Actions runners.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders — the contact route reads these at runtime and
          # degrades gracefully when they are absent, so CI never needs real secrets.
          RESEND_API_KEY: ""
          CONTACT_NOTIFICATION_EMAIL: ""

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match the Node used for development, because the npm that
          # ships with it is what wrote package-lock.json. Node 20 ships npm 10,
          # which cannot resolve an optional transitive an npm 11 lockfile
          # records differently, and every run died on "Missing: @emnapi/core
          # from lock file" before it reached a single check. GitHub is also
          # retiring Node 20 on Actions runners.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
