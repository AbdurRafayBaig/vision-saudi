name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node used for development. GitHub is also retiring
          # Node 20 on Actions runners.
          node-version: 24
          cache: npm

      # npm install, not npm ci. package-lock.json is generated on Windows, and
      # npm does not record a tree there that resolves on Linux: the top-level
      # @napi-rs/wasm-runtime is listed without its own @emnapi/core, so npm ci
      # refuses with "can only install packages when your package.json and
      # package-lock.json are in sync" and no check ever runs. Regenerating the
      # lock on Linux or macOS would fix it properly and this can go back to
      # npm ci; it cannot be regenerated correctly from a Windows machine.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders — the contact route reads these at runtime and
          # degrades gracefully when they are absent, so CI never needs real secrets.
          RESEND_API_KEY: ""
          CONTACT_NOTIFICATION_EMAIL: ""

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node used for development. GitHub is also retiring
          # Node 20 on Actions runners.
          node-version: 24
          cache: npm

      # npm install, not npm ci. package-lock.json is generated on Windows, and
      # npm does not record a tree there that resolves on Linux: the top-level
      # @napi-rs/wasm-runtime is listed without its own @emnapi/core, so npm ci
      # refuses with "can only install packages when your package.json and
      # package-lock.json are in sync" and no check ever runs. Regenerating the
      # lock on Linux or macOS would fix it properly and this can go back to
      # npm ci; it cannot be regenerated correctly from a Windows machine.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
